<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Noirly Split mark">
  <title>Noirly Split — monochrome</title>
  <!-- Default tint for standalone use. Delete this rule to inherit color from the parent. -->
  <style>svg { color: #C9A44A; }</style>
  <defs>
    <!-- Two kerfs at unequal positions: shares of 28% / 42% / 30% -->
    <mask id="nsm-kerf">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="368" y="120" width="28" height="784" fill="#000"
            transform="rotate(-7 382 512)"/>
      <rect x="616" y="120" width="28" height="784" fill="#000"
            transform="rotate(6 630 512)"/>
    </mask>
  </defs>
  <rect x="277" y="277" width="470" height="470" rx="90"
        transform="rotate(45 512 512)"
        fill="currentColor" mask="url(#nsm-kerf)"/>
</svg>
